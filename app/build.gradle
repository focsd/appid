plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('FOCSD_APPID_KEYSTORE')
def releaseKeyAlias = System.getenv('FOCSD_APPID_KEY_ALIAS')
def releaseStorePassword = System.getenv('FOCSD_APPID_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('FOCSD_APPID_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystore, releaseKeyAlias, releaseStorePassword,
                           releaseKeyPassword].every { it != null && !it.isBlank() }

android {
    namespace = 'com.focsd.appid'
    compileSdk = 35
    // Keep APK generation stable across upstream and F-Droid build environments.
    buildToolsVersion = '35.0.0'

    dependenciesInfo {
        // F-Droid rejects the Google Play SDK dependency payload as an extra
        // APK signing block. The app has no production third-party dependencies.
        includeInApk = false
        includeInBundle = false
    }

    defaultConfig {
        applicationId = 'com.focsd.appid'
        minSdk = 24
        targetSdk = 35
        versionCode = 31
        versionName = '0.12.1'
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile = file(releaseKeystore)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Keep release APK bytes independent of the source commit/tag hash.
            vcsInfo.include = false
            if (releaseSigningReady) signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        // UI copy is currently intentionally English-only and built programmatically.
        disable += ['SetTextI18n']
        // API 35 is the highest API officially supported by the pinned AGP 8.9 toolchain.
        disable += ['OldTargetApi']
    }
}

tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Fails when required FOCSD release-signing variables are absent.'
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException('Release signing is not configured. Set ' +
                    'FOCSD_APPID_KEYSTORE, FOCSD_APPID_KEY_ALIAS, ' +
                    'FOCSD_APPID_STORE_PASSWORD, and FOCSD_APPID_KEY_PASSWORD.')
        }
    }
}

tasks.register('assemblePublisherRelease') {
    group = 'build'
    description = 'Builds a release with the externally configured FOCSD signing key.'
    dependsOn tasks.named('verifyReleaseSigning')
    dependsOn tasks.named('assembleRelease')
}

tasks.register('bundlePublisherRelease') {
    group = 'build'
    description = 'Builds an app bundle with the externally configured FOCSD signing key.'
    dependsOn tasks.named('verifyReleaseSigning')
    dependsOn tasks.named('bundleRelease')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Werror']
}

dependencies {
    // The production APK remains Android-framework-only.
    testImplementation 'junit:junit:4.13.2'
}
