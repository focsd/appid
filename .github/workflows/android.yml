name: Android quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Verify Gradle wrapper integrity
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Check shell syntax and canonical script parity
        run: |
          bash -n app/src/main/assets/*.sh scripts/*.sh termux/*.sh
          ./scripts/check_termux_scripts.sh
          ./scripts/verify_fdroid_release.sh --metadata-only

      - name: Run ShellCheck
        run: shellcheck app/src/main/assets/*.sh scripts/*.sh

      - name: Test, lint, and build debug and unsigned release APKs
        run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease --stacktrace

      - name: Upload verification APKs and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appid-verification
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
